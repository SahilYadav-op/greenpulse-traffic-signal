# GreenPulse: Streamlit settings, read when the app is started from this folder (the hosted demo uses them too).
# To keep a local copy reachable from your own computer only, start it with:
#   streamlit run app/app.py --server.address 127.0.0.1

[server]
enableXsrfProtection = true       # keep the cross-site request forgery protection on
enableStaticServing = false       # no extra static file route is needed, so none is opened

[browser]
gatherUsageStats = false          # nothing is sent to Streamlit

[client]
toolbarMode = "minimal"           # no developer menu in the page

[theme]
base = "light"
primaryColor = "#1f7a5c"
backgroundColor = "#fbfdfc"
secondaryBackgroundColor = "#f2f6f5"
textColor = "#22303c"
font = "sans serif"
