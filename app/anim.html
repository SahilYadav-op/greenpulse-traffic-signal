<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreenPulse junction</title>
<style>
  :root { --ink:#22303c; --muted:#66768a; --deep:#0f2d2a; --green:#1f7a5c; --line:#e2eae7; --panel:#f2f6f5; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2px; font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--ink); background: transparent; }
  #wrap { display: grid; grid-template-columns: minmax(0, 1fr) 268px; gap: 16px; align-items: start; }
  #stage { border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: 0 8px 26px rgba(15,45,42,.09); background: #e6f1ec; }
  canvas { display: block; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(15,45,42,.05); }
  .lab { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
  .big { font-size: 34px; font-weight: 740; color: var(--deep); line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  #phase { display: inline-flex; align-items: center; gap: 7px; margin-top: 7px; padding: 3px 11px 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 650; background: var(--panel); }
  #phdot { width: 10px; height: 10px; border-radius: 50%; background: #9aa5b1; box-shadow: 0 0 0 3px rgba(154,165,177,.25); }
  .qrow { display: grid; grid-template-columns: 54px 1fr 24px; align-items: center; gap: 8px; margin: 8px 0 0 0; font-size: 13px; }
  .qrow .nm { display: flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 560; }
  .qrow .nm i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .qbar { height: 8px; border-radius: 999px; background: #e9efed; overflow: hidden; }
  .qbar i { display: block; height: 100%; border-radius: 999px; width: 0; transition: width .15s linear; }
  .qrow b { text-align: right; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  button { font: inherit; cursor: pointer; }
  #play { width: 40px; height: 40px; border-radius: 50%; border: none; background: linear-gradient(135deg,#25916d,#1f7a5c); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(31,122,92,.35); }
  #play:hover { filter: brightness(1.08); }
  #play svg { width: 16px; height: 16px; fill: #fff; }
  .seg { display: flex; background: var(--panel); border-radius: 999px; padding: 3px; gap: 2px; flex: 1; }
  .seg button { flex: 1; border: none; background: transparent; border-radius: 999px; padding: 5px 0; font-size: 12px; font-weight: 620; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--green); box-shadow: 0 1px 4px rgba(15,45,42,.15); }
  input[type=range] { width: 100%; accent-color: #1f7a5c; margin: 2px 0 0 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; }
  button:focus-visible, input:focus-visible { outline: 2px solid #1f7a5c; outline-offset: 2px; }
  @media (max-width: 760px) {
    #wrap { grid-template-columns: 1fr; }
    #side { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    #side .card { margin-bottom: 10px; }
    #ctlcard { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c" role="img" aria-label="Animated top view of the four-way junction: cars waiting on each approach and the current signal"></canvas></div>
  <div id="side">
    <div class="card">
      <div class="lab">Time</div>
      <div class="big" id="clock">0 s</div>
      <div id="phase"><i id="phdot"></i><span id="phtxt">&nbsp;</span></div>
    </div>
    <div class="card">
      <div class="lab">Cars waiting</div>
      <div class="qrow"><span class="nm"><i style="background:#1f5fa5"></i>North</span><span class="qbar"><i id="qb0" style="background:#1f5fa5"></i></span><b id="q0">0</b></div>
      <div class="qrow"><span class="nm"><i style="background:#e4572e"></i>East</span><span class="qbar"><i id="qb1" style="background:#e4572e"></i></span><b id="q1">0</b></div>
      <div class="qrow"><span class="nm"><i style="background:#2a9d8f"></i>South</span><span class="qbar"><i id="qb2" style="background:#2a9d8f"></i></span><b id="q2">0</b></div>
      <div class="qrow"><span class="nm"><i style="background:#e9b44c"></i>West</span><span class="qbar"><i id="qb3" style="background:#e9b44c"></i></span><b id="q3">0</b></div>
    </div>
    <div class="card" id="ctlcard">
      <div class="ctl">
        <button id="play" aria-label="Pause"><svg viewBox="0 0 16 16" id="playicon"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg></button>
        <div class="seg" id="speed" role="group" aria-label="Playback speed">
          <button data-v="1">1x</button><button data-v="2">2x</button><button data-v="5" class="on">5x</button><button data-v="10">10x</button><button data-v="20">20x</button>
        </div>
      </div>
      <input type="range" id="scrub" min="0" max="__LAST__" value="0" aria-label="Time in the simulation">
      <div class="legend"><span><i style="background:#2e9e6b"></i>2 cells/s</span><span><i style="background:#f2a93b"></i>1 cell/s</span><span><i style="background:#d64545"></i>stopped</span></div>
    </div>
  </div>
</div>
<script>
const D = __DATA__;
const L = D.L, T = D.sig.length;
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), stage = document.getElementById("stage");
const names = ["North", "East", "South", "West"], appCol = ["#1f5fa5", "#e4572e", "#2a9d8f", "#e9b44c"];
const ang = [90, 0, 270, 180];
const LSHOW = 18;                                   // cells drawn per approach; longer queues are summarised by the number
const NEAR = 2.2, ROAD = 1.95;                      // half width of the junction box and of the road, in cells
let W = 640, H = 640, cx = 320, cy = 320, u = 10, dpr = 1;
let t = 0, playing = true, last = performance.now(), acc = 0, dirty = true;

function rr(x, y, w, h, r) {                         // rounded rectangle path (works in every browser)
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}

function resize() {
  const avail = Math.max(300, Math.min(stage.clientWidth, 700));
  dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
  W = Math.round(avail); H = Math.round(Math.min(avail, 640));
  cv.style.width = W + "px"; cv.style.height = H + "px"; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cx = W / 2; cy = H / 2; u = (Math.min(W, H) / 2 - 10) / (NEAR + LSHOW + 0.8);
  dirty = true;
}

function sky() {                                       // pavement background with a soft vignette
  const g = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.1, cx, cy, Math.max(W, H) * 0.75);
  g.addColorStop(0, "#f2f8f5"); g.addColorStop(1, "#dcebe4");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function arm(a, occ, green) {
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(1, -1); ctx.rotate(ang[a] * Math.PI / 180); ctx.scale(u, u);
  // road surface with edge lines and a dashed centre line
  ctx.fillStyle = "#3b4753"; ctx.fillRect(NEAR - 0.2, -ROAD, LSHOW + 0.2 + 1.6, 2 * ROAD);
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fillRect(NEAR - 0.2, -ROAD, LSHOW + 1.8, 0.07); ctx.fillRect(NEAR - 0.2, ROAD - 0.07, LSHOW + 1.8, 0.07);
  ctx.strokeStyle = "#f3d46b"; ctx.lineWidth = 0.09; ctx.setLineDash([0.7, 0.55]); ctx.beginPath(); ctx.moveTo(NEAR, 0); ctx.lineTo(NEAR + LSHOW + 1.6, 0); ctx.stroke(); ctx.setLineDash([]);
  if (green) { ctx.fillStyle = "rgba(46,158,107,.20)"; ctx.fillRect(NEAR, -ROAD + 0.1, LSHOW + 1.4, ROAD - 0.25); }
  // cars: nearest cell first; colour tells the speed
  for (let c = 0; c < LSHOW; c++) {
    const v1 = +occ[c];
    if (v1 > 0) {
      const v = v1 - 1, x = NEAR + c + 0.07;
      ctx.fillStyle = v === 0 ? "#d64545" : (v === 1 ? "#f2a93b" : "#2e9e6b");
      rr(x, -1.62, 0.86, 1.06, 0.26); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.22)"; ctx.lineWidth = 0.05; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.62)"; rr(x + 0.1, -1.42, 0.26, 0.66, 0.08); ctx.fill();      // windscreen at the front
    }
  }
  // stop line and signal head
  ctx.fillStyle = "#ffffff"; ctx.fillRect(NEAR - 0.06, -ROAD + 0.12, 0.14, ROAD - 0.28);
  const lx = NEAR + 0.9, ly = -ROAD - 0.95;
  ctx.fillStyle = "#1b252d"; rr(lx - 0.62, ly - 0.62, 1.24, 1.24, 0.5); ctx.fill();
  ctx.save(); ctx.shadowColor = green ? "rgba(46,158,107,.95)" : "rgba(214,69,69,.95)"; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(lx, ly, 0.42, 0, 2 * Math.PI); ctx.fillStyle = green ? "#34c37f" : "#ee5a5a"; ctx.fill(); ctx.restore();
  ctx.restore();
}

function chip(a, qn, green) {
  const phi = ang[a] * Math.PI / 180, lx = (NEAR + LSHOW * 0.52) * u, ly = (ROAD + 1.75) * u;
  let px = cx + lx * Math.cos(phi) - ly * Math.sin(phi), py = cy - (lx * Math.sin(phi) + ly * Math.cos(phi));
  const label = names[a] + "  " + qn;
  ctx.font = "650 12px Inter, 'Segoe UI', system-ui, sans-serif";
  const w = ctx.measureText(label).width + 30, h = 24;
  px = Math.max(w / 2 + 4, Math.min(W - w / 2 - 4, px)); py = Math.max(h / 2 + 4, Math.min(H - h / 2 - 4, py));
  ctx.save(); ctx.shadowColor = "rgba(15,45,42,.18)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
  ctx.fillStyle = "#ffffff"; rr(px - w / 2, py - h / 2, w, h, 12); ctx.fill(); ctx.restore();
  ctx.strokeStyle = green ? "#2e9e6b" : "#e2eae7"; ctx.lineWidth = green ? 1.6 : 1; rr(px - w / 2, py - h / 2, w, h, 12); ctx.stroke();
  ctx.fillStyle = appCol[a]; ctx.beginPath(); ctx.arc(px - w / 2 + 12, py, 4.2, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = "#22303c"; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(label, px - w / 2 + 21, py + 0.5);
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H); sky();
  const s = D.sig[t];
  for (let a = 0; a < 4; a++) arm(a, D.occ[t][a], s === a);
  // junction box on top of the arms
  ctx.fillStyle = "#46535f"; rr(cx - NEAR * u, cy - NEAR * u, 2 * NEAR * u, 2 * NEAR * u, 0.35 * u); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 1; ctx.setLineDash([5, 5]); rr(cx - NEAR * u + 6, cy - NEAR * u + 6, 2 * NEAR * u - 12, 2 * NEAR * u - 12, 0.3 * u); ctx.stroke(); ctx.setLineDash([]);
  for (let a = 0; a < 4; a++) chip(a, D.q[t][a], s === a);
  document.getElementById("clock").textContent = t + " s";
  const dot = document.getElementById("phdot");
  if (s >= 0) { document.getElementById("phtxt").textContent = "Green: " + names[s]; dot.style.background = "#2e9e6b"; dot.style.boxShadow = "0 0 0 3px rgba(46,158,107,.25)"; }
  else { document.getElementById("phtxt").textContent = "All red (clearance)"; dot.style.background = "#d64545"; dot.style.boxShadow = "0 0 0 3px rgba(214,69,69,.22)"; }
  for (let a = 0; a < 4; a++) {
    const q = D.q[t][a];
    document.getElementById("q" + a).textContent = q;
    document.getElementById("qb" + a).style.width = Math.min(100, q / 24 * 100) + "%";
  }
  document.getElementById("scrub").value = t;
}

function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (playing) {
    acc += dt * (+document.querySelector("#speed .on").dataset.v);
    while (acc >= 1) { acc -= 1; t = (t + 1) % T; dirty = true; }
  }
  if (dirty) { draw(); dirty = false; }
  requestAnimationFrame(frame);
}

const playBtn = document.getElementById("play"), icon = document.getElementById("playicon");
function setPlaying(p) {
  playing = p; playBtn.setAttribute("aria-label", p ? "Pause" : "Play");
  icon.innerHTML = p ? '<rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/>' : '<path d="M4 2.2v11.6a.6.6 0 0 0 .9.5l9.2-5.8a.6.6 0 0 0 0-1L4.9 1.7a.6.6 0 0 0-.9.5z"/>';
}
playBtn.onclick = () => setPlaying(!playing);
document.querySelectorAll("#speed button").forEach(b => b.onclick = () => { document.querySelectorAll("#speed button").forEach(x => x.classList.remove("on")); b.classList.add("on"); });
document.getElementById("scrub").oninput = function () { t = +this.value; dirty = true; };
window.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); setPlaying(!playing); } });
window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
